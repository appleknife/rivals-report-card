<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: 'Anton'; src: url('../src/fonts/anton-latin-400-normal.woff2') format('woff2'); }
html, body { margin: 0; background: transparent; }
.icon { width: 256px; height: 256px; border-radius: 52px; position: relative; overflow: hidden;
  background: radial-gradient(circle at 30% 20%, #262c48, #0b0d16 70%); }
.dots { position: absolute; inset: 0; background: radial-gradient(circle, rgba(255,46,99,.45) 2px, transparent 2.6px) 0 0 / 14px 14px;
  -webkit-mask: linear-gradient(200deg, #000 0%, transparent 55%); }
.badge { position: absolute; left: 30px; top: 46px; width: 196px; height: 164px; background: #ffd23f;
  clip-path: polygon(14% 0, 100% 0, 86% 100%, 0 100%); }
.txt { position: absolute; left: 0; right: 0; top: 34px; text-align: center; font-family: 'Anton'; font-size: 158px; line-height: 1;
  font-style: italic; color: #0b0d16; transform: rotate(-6deg); letter-spacing: -2px; text-shadow: 6px 6px 0 #ff2e63; }
</style></head><body><div class="icon"><div class="dots"></div><div class="badge"></div><div class="txt">A+</div></div></body></html>
